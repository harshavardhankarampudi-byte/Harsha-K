name: Update Profile README

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update README with stats
        run: |
          echo "README will be auto-updated with latest GitHub stats!"
          # GitHub stats badges dynamically update from shields.io and github-readme-stats
          # No manual action needed - they fetch live data

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "🔄 Update profile stats" --allow-empty
          git push
